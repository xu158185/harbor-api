services:
  # ---------- PostgreSQL 18 ----------
  postgres:
    image: postgres:18-alpine
    container_name: harbor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: harborapi
      POSTGRES_USER: harborapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - harbor-net

  # ---------- Redis 8 ----------
  redis:
    image: redis:8-alpine
    container_name: harbor-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - harbor-net

  # ---------- sub2api ----------
  sub2api:
    image: xu158185/harbor-sub2api:latest
    container_name: harbor-sub2api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: harborapi
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: harborapi
      DB_SSLMODE: disable
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      # 应用配置
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?请在 .env 中设置 TOTP_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 服务器配置
      SERVER_HOST: ${BIND_HOST:-0.0.0.0}
      SERVER_PORT: 8080
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/sub2api:/app/data
      - ./logs/sub2api:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - harbor-net

  # ---------- new-api ----------
  new-api:
    image: xu158185/harbor-new-api:latest
    container_name: harbor-new-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库 (new-api 使用单一 SQL_DSN)
      SQL_DSN: postgres://harborapi:${POSTGRES_PASSWORD}@postgres:5432/harborapi?sslmode=disable
      # Redis (new-api 使用单一 REDIS_CONN_STRING)
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Session 密钥
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      # 服务器配置
      PORT: 3000
      TZ: ${TZ:-Asia/Shanghai}
      # 品牌配置（可选，也可以在 Web UI 中设置）
      SYSTEM_NAME: HarborAPI
    volumes:
      - ./data/new-api:/data
      - ./logs/new-api:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - harbor-net

  # ---------- Caddy (HTTPS 反向代理) ----------
  caddy:
    image: caddy:2-alpine
    container_name: harbor-caddy
    restart: unless-stopped
    depends_on:
      - sub2api
      - new-api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks:
      - harbor-net

networks:
  harbor-net:
    driver: bridge
